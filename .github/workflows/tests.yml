name: EZ CAM tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux native Gmsh dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - name: Install native STEP backend and program
        run: python -m pip install -e ".[step]"
      - name: Run deterministic and real synthetic STEP tests
        env:
          EZCAM_REQUIRE_GMSH: "1"
        run: python -m unittest discover -s tests -v
